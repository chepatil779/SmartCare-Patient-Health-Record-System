<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCare - Edit Patient</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-hospital-user me-2"></i>SmartCare</a>
            <div>
                <a th:href="@{/patients-page}" class="btn btn-light btn-sm fw-semibold shadow-sm text-primary">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Patients
                </a>
            </div>
        </div>
    </nav>

    <div class="container mb-5" style="max-width: 800px;">

        <!-- Edit Form Card -->
        <div class="card card-custom p-4 bg-white">
            <h4 class="card-title fw-bold text-primary mb-1">
                <i class="fa-solid fa-user-pen me-2"></i>Edit Patient Details
            </h4>
            <p class="text-muted small mb-3">Update patient information for ID #<span th:text="${patient.id}"></span></p>
            <hr class="text-muted mb-4">

            <form th:action="@{/patients/update/{id}(id=${patient.id})}" method="post">
                <div class="row g-3">
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Patient Name</label>
                        <input type="text" name="name" th:value="${patient.name}" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Age</label>
                        <input type="number" name="age" th:value="${patient.age}" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Gender</label>
                        <select name="gender" class="form-select" required>
                            <option value="Male" th:selected="${patient.gender == 'Male'}">Male</option>
                            <option value="Female" th:selected="${patient.gender == 'Female'}">Female</option>
                            <option value="Other" th:selected="${patient.gender == 'Other'}">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Phone Number</label>
                        <input type="text" name="phone" th:value="${patient.phone}" class="form-control" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Disease / Symptoms</label>
                        <input type="text" name="disease" th:value="${patient.disease}" class="form-control" required>
                    </div>

                    <div class="col-12 d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-warning text-white fw-semibold px-4 shadow-sm">
                            <i class="fa-solid fa-pen-to-square me-1"></i> Update Details
                        </button>
                        <a th:href="@{/patients-page}" class="btn btn-outline-secondary px-4 fw-semibold">
                            Cancel
                        </a>
                    </div>

                </div>
            </form>
        </div>

    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
