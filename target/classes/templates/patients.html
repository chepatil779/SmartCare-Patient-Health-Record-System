<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCare - Patient Directory</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-hospital-user me-2"></i>SmartCare</a>
            <div>
                <a th:href="@{/}" class="btn btn-light btn-sm fw-semibold shadow-sm text-primary">
                    <i class="fa-solid fa-plus me-1"></i> Add Patient
                </a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">

        <div class="card card-custom p-4 bg-white">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 gap-3">
                <div>
                    <h4 class="fw-bold text-primary mb-1"><i class="fa-solid fa-users me-2"></i>Patient Directory</h4>
                    <p class="text-muted small mb-0">View, search, and manage patient records.</p>
                </div>
                
                <!-- Search Bar Form -->
                <form th:action="@{/patients-page}" method="get" class="d-flex gap-2">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by name/disease...">
                    <button type="submit" class="btn btn-primary fw-semibold"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <a th:href="@{/patients-page}" class="btn btn-outline-secondary" title="Reset Search"><i class="fa-solid fa-rotate-left"></i></a>
                </form>
            </div>

            <!-- Table -->
            <div class="table-responsive mt-3">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Phone</th>
                            <th>Disease</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="patient : ${patients}">
                            <td class="fw-bold text-secondary" th:text="${patient.id}">1</td>
                            <td class="fw-semibold" th:text="${patient.name}">Rahul Patil</td>
                            <td th:text="${patient.age}">28</td>
                            <td th:text="${patient.gender}">Male</td>
                            <td th:text="${patient.phone}">9876543210</td>
                            <td><span class="badge bg-info text-dark" th:text="${patient.disease}">Fever</span></td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-1">
                                    <a th:href="@{/medical-history-page/{id}(id=${patient.id})}" class="btn btn-sm btn-success fw-semibold">
                                        <i class="fa-solid fa-notes-medical me-1"></i> History
                                    </a>
                                    <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-sm btn-warning text-white fw-semibold">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </a>
                                    <form th:action="@{/patients/delete/{id}(id=${patient.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this patient?');">
                                        <button type="submit" class="btn btn-sm btn-danger fw-semibold">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(patients)}">
                            <td colspan="7" class="text-center text-muted py-4">No patients found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
