<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCare - Medical History</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-hospital-user me-2"></i>SmartCare</a>
            <div>
                <a th:href="@{/patients-page}" class="btn btn-light btn-sm fw-semibold shadow-sm text-primary">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Patients
                </a>
            </div>
        </div>
    </nav>

    <div class="container mb-5" style="max-width: 900px;">

        <!-- Success Alert Banner -->
        <div th:if="${success != null}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>Medical history record added successfully!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Delete Alert Banner -->
        <div th:if="${deleted != null}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="fa-solid fa-trash-can me-2"></i>Medical history entry deleted!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Patient Details Info Card -->
        <div class="card card-custom p-4 bg-white mb-4">
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <h4 class="fw-bold text-primary mb-1">
                        <i class="fa-solid fa-id-card me-2"></i>Patient: <span th:text="${patient.name}"></span>
                    </h4>
                    <div class="text-muted small mt-2">
                        <span class="me-3"><i class="fa-solid fa-calendar-days me-1"></i> Age: <strong th:text="${patient.age}"></strong></span>
                        <span class="me-3"><i class="fa-solid fa-venus-mars me-1"></i> Gender: <strong th:text="${patient.gender}"></strong></span>
                        <span><i class="fa-solid fa-stethoscope me-1"></i> Disease: <strong th:text="${patient.disease}"></strong></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Medical History Form Card -->
        <div class="card card-custom p-4 bg-white mb-4">
            <h5 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-notes-medical me-2"></i>Add New History Record</h5>
            <form th:action="@{/save-medical-history/{id}(id=${patient.id})}" method="post">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Visit Date</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Problem / Symptoms</label>
                        <input type="text" name="problem" class="form-control" placeholder="e.g. High Fever, Cough" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Treatment / Prescription</label>
                        <input type="text" name="treatment" class="form-control" placeholder="e.g. Paracetamol 500mg" required>
                    </div>
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-success fw-semibold shadow-sm">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Save History
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Medical History Table Card -->
        <div class="card card-custom p-4 bg-white">
            <h5 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-clock-rotate-left me-2"></i>Past Medical History</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Visit Date</th>
                            <th>Problem</th>
                            <th>Treatment</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="history, iterStat : ${historyList}">
                            <td class="fw-bold text-secondary" th:text="${iterStat.count}">1</td>
                            <td th:text="${history.date}">2026-10-09</td>
                            <td class="fw-semibold" th:text="${history.problem}">Fever</td>
                            <td th:text="${history.treatment}">Paracetamol</td>
                            <td class="text-center">
                                <form th:action="@{/medical-history/delete/{hId}/{pId}(hId=${history.id}, pId=${patient.id})}" method="post" onsubmit="return confirm('Delete this record?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(historyList)}">
                            <td colspan="5" class="text-center text-muted py-4">No medical history recorded yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
